{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card">
  <h1 style="margin-top:0;">Регистрация</h1>
  <p class="muted">Придумай логин и пароль. Свои события видишь только ты.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register" autocomplete="off">
    <label>Логин <input name="username" required minlength="2" maxlength="64" autocomplete="username" /></label>
    <label>Пароль <input name="password" type="password" required minlength="4" maxlength="128" autocomplete="new-password" /></label>
    <label>Пароль ещё раз <input name="password_confirm" type="password" required minlength="4" maxlength="128" autocomplete="new-password" /></label>
    <label style="margin-top:1rem;"><button class="btn btn-primary" type="submit">Зарегистрироваться</button></label>
  </form>
  <p class="muted" style="margin-top:1rem;"><a href="/login" style="color:var(--accent);">Уже есть аккаунт — войти</a></p>
</div>
{% endblock %}
