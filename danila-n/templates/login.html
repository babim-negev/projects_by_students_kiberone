{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card">
  <h1 style="margin-top:0;">Вход</h1>
  {% if info == "registered" %}
    <p class="muted" style="color:#4ade80;">Регистрация прошла успешно. Теперь войди с тем же логином и паролем.</p>
  {% endif %}
  <p class="muted">Нет аккаунта? <a href="/register" style="color:var(--accent);">Зарегистрироваться</a></p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Логин <input name="username" required autocomplete="username" /></label>
    <label>Пароль <input name="password" type="password" required autocomplete="current-password" /></label>
    <label style="margin-top:1rem;"><button class="btn btn-primary" type="submit">Войти</button></label>
  </form>
</div>
{% endblock %}
