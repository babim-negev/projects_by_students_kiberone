<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Расписание{% endblock %}</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #38bdf8; --danger: #f87171; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.5; }
    header { background: var(--card); padding: 0.75rem 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    nav a { color: var(--accent); margin-right: 1rem; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 52rem; margin: 0 auto; padding: 1.25rem; }
    .card { background: var(--card); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; border: 1px solid #334155; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .error { color: var(--danger); margin: 0.5rem 0; }
    button, .btn { cursor: pointer; border: 0; border-radius: 8px; padding: 0.45rem 0.9rem; font-size: 1rem; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--accent); color: #0f172a; font-weight: 600; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid #475569; }
    .btn-danger { background: #7f1d1d; color: #fecaca; font-size: 0.85rem; }
    input, textarea { width: 100%; max-width: 22rem; padding: 0.5rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: var(--text); }
    label { display: block; margin-top: 0.75rem; font-size: 0.9rem; color: var(--muted); }
    ul.events { list-style: none; padding: 0; margin: 0; }
    ul.events li { padding: 0.65rem 0; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; }
    .row-nav { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <nav>
      {% if user is defined and user %}
        <a href="/day">День</a>
        <a href="/week">Неделя</a>
        <a href="/month">Месяц</a>
        <a href="/events/new">+ Событие</a>
      {% endif %}
    </nav>
    <div class="muted">
      {% if user is defined and user %}
        {{ user.username }} · <a href="/logout" style="color: var(--muted);">Выйти</a>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
